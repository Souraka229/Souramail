# Domain / IP / SPF reputation (docs/05 §1, §4.4). Feeds the "réputation" leg of
# the security order and the abuse risk score.
rules {
  ip_reputation {
    selector = "ip";
    symbol = "IP_REPUTATION";
  }
  spf_reputation {
    selector = "spf";
    symbol = "SPF_REPUTATION";
  }
  dkim_reputation {
    selector = "dkim";
    symbol = "DKIM_REPUTATION";
  }
  generic_reputation {
    selector = "from";
    symbol = "GENERIC_REPUTATION";
  }
}
backend = "redis";
