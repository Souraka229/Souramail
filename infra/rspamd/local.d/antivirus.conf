# ClamAV on attachments (docs/05 §1, references #3). Standard open-source AV with
# auto-updated signatures (freshclam runs inside the clamav container).
clamav {
  type = "clamav";
  servers = "clamav:3310";
  scan_mime_parts = true;
  scan_text_mime = false;
  scan_image_mime = false;
  max_size = 20971520;          # 20 MiB — skip huge parts, they can't hold a payload
  symbol = "CLAM_VIRUS";
  action = "reject";
  message = "Message rejected: infected attachment (${SCANNER_NAME})";
}
