# Outbound rate limiting (docs/05 §4.2 step 1, §4.4). The abuse-engine in
# @souramail/core sets dynamic per-workspace limits; these are the hard
# infrastructure ceilings so a compromised key can't torch IP reputation.
#
# `bounce` / `to` limits also blunt classic spam-run patterns.
rates {
  # new-ish authenticated senders: conservative
  authenticated_per_domain {
    bucket = [
      { burst = 50; rate = "50 / 1min"; }
    ];
    selector = 'user.domain';
  }
  # per-recipient throttle (diversity signal, docs/05 §4.4)
  to {
    bucket = [
      { burst = 20; rate = "20 / 1min"; }
    ];
  }
}

whitelisted_rcpts = "postmaster,mailer-daemon,abuse";
max_rcpt = 100;
