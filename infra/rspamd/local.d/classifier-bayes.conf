# Statistical classifier, Redis-backed so it survives restarts and is shared
# across nodes (docs/05 §1). Autolearn keeps it useful without manual training.
backend = "redis";
autolearn = [-5, 10];
new_schema = true;
expire = 8640000;              # 100 days
min_learns = 200;

statfile {
  BAYES_SPAM {
    spam = true;
  }
  BAYES_HAM {
    spam = false;
  }
}
