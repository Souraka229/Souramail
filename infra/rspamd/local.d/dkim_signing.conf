# Outbound DKIM signing (docs/05 §4.2 step 4). Selector `soura`, one key per
# customer domain. Keys are generated by StalwartAdmin.createDkim() / a KMS and
# dropped here as <domain>.soura.key; the matching public key is published as the
# soura._domainkey TXT record by DnsProvider.
#
# Rspamd signs only mail that authenticated on submission (587/465) — never
# inbound relayed mail.
enabled = true;

sign_authenticated = true;
sign_local = true;
use_domain = "envelope";
allow_hdrfrom_mismatch = false;
allow_username_mismatch = true;

selector = "soura";
path = "/var/lib/rspamd/dkim/$domain.$selector.key";

# Per-domain overrides can be added under signing_table when keys land in Redis.
# signing_table = "redis://DKIM_KEYS";
