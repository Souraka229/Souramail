# Local development stack for SouraMAIL.
# Phase 0 needs: postgres, redis, minio.
# Phase 1 wires in: stalwart, rspamd, clamav, unbound (kept here, profiled `mail`).
#
#   docker compose -f infra/docker-compose.yml up -d            # core
#   docker compose -f infra/docker-compose.yml --profile mail up -d   # + mail edge

name: souramail

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: souramail
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d souramail"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/souramail-mail &&
      mc anonymous set none local/souramail-mail &&
      echo 'bucket ready';
      "

  # ─── Mail edge — profile: mail (Phase 1) ─────────────────────────────────
  unbound:
    image: mvance/unbound:latest
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "5335:53/udp"
      - "5335:53/tcp"

  clamav:
    image: clamav/clamav:latest
    profiles: ["mail"]
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - ./.data/clamav:/var/lib/clamav

  rspamd:
    image: rspamd/rspamd:latest
    profiles: ["mail"]
    restart: unless-stopped
    depends_on: [redis, unbound, clamav]
    ports:
      - "11332:11332"  # milter / proxy
      - "11333:11333"  # controller
      - "11334:11334"  # web UI
    volumes:
      - ./rspamd/local.d:/etc/rspamd/local.d:ro
      - ./.data/rspamd:/var/lib/rspamd
      - ./.data/dkim:/var/lib/rspamd/dkim   # per-domain <domain>.soura.key files

  stalwart:
    image: stalwartlabs/stalwart:latest
    profiles: ["mail"]
    restart: unless-stopped
    depends_on: [postgres, redis, rspamd]
    ports:
      - "25:25"      # SMTP
      - "587:587"    # submission
      - "465:465"    # submissions
      - "143:143"    # IMAP
      - "993:993"    # IMAPS
      - "8080:8080"  # HTTP: admin + JMAP
    environment:
      MAIL_HOSTNAME: "${MAIL_HOSTNAME:-mx1.localhost}"
      STALWART_ADMIN_SECRET: "${STALWART_ADMIN_SECRET:-change-me-in-prod}"
      SMTP_RELAY_HOST: "${SMTP_RELAY_HOST:-}"
      SMTP_RELAY_PORT: "${SMTP_RELAY_PORT:-587}"
      SMTP_RELAY_USER: "${SMTP_RELAY_USER:-}"
      SMTP_RELAY_PASS: "${SMTP_RELAY_PASS:-}"
      TLS_CERT: "${TLS_CERT:-/opt/stalwart/etc/certs/dev.crt}"
      TLS_KEY: "${TLS_KEY:-/opt/stalwart/etc/certs/dev.key}"
    volumes:
      - ./stalwart/config:/opt/stalwart/etc:ro
      - ./.data/stalwart:/opt/stalwart/data
