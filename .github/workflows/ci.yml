name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  db-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: souramail
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_OWNER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/souramail
      DATABASE_URL: postgres://souramail_app:souramail_app@localhost:5432/souramail
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/souramail
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: create app role
        run: psql "$MIGRATION_DATABASE_URL" -f infra/postgres/init/01-roles.sql
      - name: migrate + apply RLS
        run: pnpm --filter @souramail/db generate && pnpm --filter @souramail/db migrate
      - name: tenant isolation test
        run: pnpm --filter @souramail/db test
